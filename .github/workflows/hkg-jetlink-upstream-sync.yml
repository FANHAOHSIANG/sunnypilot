name: HKG Jetlink upstream sync

on:
  schedule:
    - cron: '33 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hkg-jetlink-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'FANHAOHSIANG/sunnypilot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      TARGET_BRANCH: hkg-enhanced-jetlink
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hkg-enhanced-jetlink
          fetch-depth: 0
          lfs: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge Tony HKG and official sunnypilot
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add tony https://github.com/TonyBinheWu/sunnypilot.git
          git remote add sp https://github.com/sunnypilot/sunnypilot.git
          git fetch --no-tags tony hkg-enhanced
          git fetch --no-tags sp master
          original=$(git rev-parse HEAD)
          git merge --no-edit tony/hkg-enhanced
          git merge --no-edit sp/master
          if [ "$original" = "$(git rev-parse HEAD)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="sync/hkg-jetlink-$(git rev-parse --short=10 tony/hkg-enhanced)-$(git rev-parse --short=10 sp/master)"
          git switch -c "$branch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Check Jetlink integration
        if: steps.merge.outputs.changed == 'true'
        run: |
          python -m pip install numpy pytest pycapnp requests
          git submodule update --init --depth 1 tinygrad_repo opendbc_repo panda
          python tools/jetlink/check_panda_compat.py --self-test
          python tools/jetlink/check_panda_compat.py
          python -m unittest discover -s openpilot/selfdrive/modeld/jetlink/tests -v
          python -m compileall -q openpilot/selfdrive/modeld/jetlink openpilot/selfdrive/modeld/modeld.py
          PYTHONPATH=third_party/jetlink python -m pytest -q -c /dev/null third_party/jetlink/tests/test_registry.py
          PYTHONPATH=opendbc_repo python -m unittest openpilot.sunnypilot.selfdrive.car.tests.test_bsm_compat -v
          PYTHONPATH=opendbc_repo python -m unittest openpilot.sunnypilot.selfdrive.car.tests.test_dynamics_compat -v
          python -m unittest openpilot.selfdrive.ui.tests.test_blue_path openpilot.selfdrive.ui.tests.test_sunnylink_translations -v
          python tools/commaview/install.py --check
          git -c core.whitespace=-blank-at-eof diff --check HEAD~1 HEAD
      - name: Open an update PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Never move the installed branch. Conflicts or failed checks stop this job.
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            echo 'This upstream revision already has a sync branch.'
            exit 0
          fi
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          gh pr create --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" \
            --title 'Sync HKG Jetlink with Tony and official sunnypilot' \
            --body 'Merges Tony hkg-enhanced and official sunnypilot master; dependency conflicts stop for review. Jetlink software regression checks passed. Review runtime and UI changes and validate on C4 before merging. This PR does not update installed devices.'

